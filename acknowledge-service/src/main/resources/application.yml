server:
  port: 8081

spring:
  application:
    name: acknowledge-service

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:172.16.88.115:9092}

    consumer:
      group-id: acknowledge-service
      auto-offset-reset: earliest
      enable-auto-commit: false

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      acks: all
      enable-idempotence: true
      retries: 10

app:
  kafka:
    topics:
      ack: ack.event

vault:
  uri: http://172.16.88.115:8200
  token: root
security:
  authentication:
    enabled: true
  jwt-secret: my-super-secret-key-my-super-secret-key
  vault:
    transit:
      key-name: bank-jwt-v2