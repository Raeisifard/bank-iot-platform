server:
  port: 8081

spring:
  application:
    name: acknowledge-service
  profiles:
    active: dev
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:9000}
        auto-registration: true
        instance:
          prefer-ip: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:172.16.88.115:9092}
    consumer:
      group-id: acknowledge-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      enable-idempotence: true
      retries: 10

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

common:
  vault:
    enabled: ${COMMON_VAULT_ENABLED:true}
    uri: ${VAULT_URI:http://172.16.88.115:8200}
    token: ${VAULT_TOKEN:root}
    kv:
      enabled: true
      mount: ${VAULT_KV_MOUNT:kv}
    transit:
      enabled: true
      mount: ${VAULT_TRANSIT_MOUNT:transit}

  security:
    enabled: true
    jwt:
      enabled: true
      algorithm: RS256
      clock-skew: 30s
      issuer: ${TOKEN_ISSUER:isc-token-service}
      audiences:
        - ${TOKEN_AUDIENCE:isc-services}
      vault-key-name: ${TOKEN_JWT_KEY_NAME:bank-jwt-v2}
      policy-path: ${TOKEN_JWT_POLICY_PATH:key-management/bank-jwt}
      policy-mount: ${TOKEN_JWT_POLICY_MOUNT:kv}

  web:
    enabled: true
    security-enabled: true
    authentication-enabled: true

  redis:
    enabled: ${COMMON_REDIS_ENABLED:true}
    url: ${COMMON_REDIS_URL:redis://172.16.88.115:6379}
    password: ${REDIS_PASSWORD:StrongRedisPassword}
    database: ${REDIS_DATABASE:0}
    timeout: ${REDIS_TIMEOUT:2s}

app:
  kafka:
    topics:
      ack: ack.event

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

info:
  app:
    name: token-service
    description: Dedicated token-issuing service
    version: 1.0.0

logging:
  level:
    org.apache.kafka: WARN
