<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Simulator</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #111827;
            --panel-alt: #0b1220;
            --panel-border: #334155;
            --primary: #60a5fa;
            --primary-strong: #2563eb;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --success: #22c55e;
            --warning: #fbbf24;
            --danger: #f87171;
            --header-height: 62px;
        }

        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        body {
            display: flex;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 340px;
            min-width: 340px;
            background: var(--panel);
            border-right: 1px solid var(--panel-border);
            padding: 16px 14px 14px;
            transition: width 0.2s ease, min-width 0.2s ease, transform 0.2s ease;
            overflow-y: auto;
            position: relative;
        }

        .sidebar.collapsed {
            width: 64px;
            min-width: 64px;
            padding-left: 10px;
            padding-right: 10px;
        }

        .sidebar.collapsed .sidebar-title,
        .sidebar.collapsed .field,
        .sidebar.collapsed .sidebar-subtext,
        .sidebar.collapsed .action-button {
            display: none;
        }

        .sidebar.collapsed .pin-toggle {
            right: 10px;
        }

        .sidebar-header {
            position: sticky;
            top: 0;
            background: rgba(17, 24, 39, 0.92);
            backdrop-filter: blur(2px);
            border-bottom: 1px solid var(--panel-border);
            margin: -16px -14px 12px;
            padding: 14px 16px 12px;
            z-index: 1;
        }

        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
        }

        .pin-toggle {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            background: #1f2937;
            color: var(--text);
            cursor: pointer;
            font-size: 18px;
            padding: 0;
        }

        .pin-toggle:hover { background: #273449; }

        .field {
            margin: 10px 0;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 10px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            background: rgba(15, 23, 42, 0.8);
            color: var(--text);
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        textarea { min-height: 70px; resize: vertical; }

        .action-button {
            display: block;
            width: 100%;
            background: linear-gradient(180deg, var(--primary-strong), #1d4ed8);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 12px;
            margin: 8px 0;
            font-weight: 600;
            cursor: pointer;
            transition: filter 0.15s ease, transform 0.15s ease;
        }

        .action-button:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
        }

        .action-button.secondary {
            background: #1f2937;
            border: 1px solid var(--panel-border);
        }

        .sidebar-subtext {
            margin-top: 14px;
            font-size: 0.72rem;
            color: var(--muted);
            line-height: 1.5;
        }

        .main-panel {
            flex: 1;
            background: var(--panel-alt);
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100vh;
        }

        .main-header {
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px 0 20px;
            border-bottom: 1px solid var(--panel-border);
            background: rgba(11, 18, 32, 0.9);
        }

        .main-header h2 {
            margin: 0;
            font-size: 1.05rem;
        }

        .response-toolbar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .response-title {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .copy-button {
            background: #1f2937;
            border: 1px solid var(--panel-border);
            color: var(--text);
            border-radius: 8px;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 16px;
        }

        .response-wrap {
            flex: 1;
            overflow: auto;
            padding: 18px;
        }

        .response-card {
            background: #020817;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            min-height: calc(100vh - 120px);
            padding: 18px;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            color: #dbeafe;
            font-family: "SFMono-Regular", Consolas, monospace;
            font-size: 0.88rem;
            line-height: 1.55;
            min-height: 100%;
        }

        .json-key { color: #93c5fd; }
        .json-string { color: #86efac; }
        .json-number { color: #fbbf24; }
        .json-boolean { color: #f9a8d4; }
        .json-null { color: #c4b5fd; }

        @media (max-width: 900px) {
            .sidebar {
                width: 260px;
                min-width: 260px;
            }
        }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1 class="sidebar-title">Client Enrollment</h1>
            <button class="pin-toggle" id="pinToggle" title="Pin sidebar">📌</button>
        </div>

        <div class="field">
            <label for="cid">CID</label>
            <input id="cid" value="client-001" />
        </div>
        <div class="field">
            <label for="did">DID</label>
            <input id="did" value="did:key:example-001" />
        </div>
        <div class="field">
            <label for="securityLevel">Security Level</label>
            <select id="securityLevel">
                <option>SOFTWARE</option>
                <option selected>TRUSTED_ENVIRONMENT</option>
                <option>STRONGBOX</option>
            </select>
        </div>

        <button class="action-button" data-request-name="Generate Identity" id="generateIdentity">Generate Identity</button>
        <button class="action-button secondary" data-request-name="Generate Attestation" id="generateAttestation">Generate Attestation</button>
        <button class="action-button" data-request-name="Enroll Client" id="enrollClient">Enroll Client</button>
        <button class="action-button secondary" data-request-name="Request Challenge" id="requestChallenge">Request Challenge</button>
        <button class="action-button" data-request-name="Verify Proof" id="verifyProof">Verify Proof</button>
        <button class="action-button secondary" data-request-name="Request Access Token" id="requestToken">Request Access Token</button>

        <div class="sidebar-subtext">
            SIMULATED TEE / SIMULATED STRONGBOX / SIMULATED ANDROID KEYSTORE
        </div>
    </aside>

    <main class="main-panel">
        <header class="main-header">
            <h2>Server Responses <span id="requestLabel">(none)</span></h2>
            <div class="response-toolbar">
                <button class="copy-button" id="copyButton" title="Copy JSON">⧉</button>
            </div>
        </header>

        <div class="response-wrap">
            <div class="response-card">
                <pre id="responseBox">{}</pre>
            </div>
        </div>
    </main>
</div>

<script>
    const responseBox = document.getElementById('responseBox');
    const requestLabel = document.getElementById('requestLabel');
    const copyButton = document.getElementById('copyButton');
    const sidebar = document.getElementById('sidebar');
    const pinToggle = document.getElementById('pinToggle');
    const collapsedKey = 'simulatorSidebarCollapsed';
    const pinnedKey = 'simulatorSidebarPinned';

    function updateRequestLabel(name) {
        requestLabel.textContent = name ? `(${name})` : '(none)';
    }

    function setResponseContent(rawText, requestName) {
        const trimmed = rawText && rawText.trim() ? rawText.trim() : '{}';
        let pretty = trimmed;
        try {
            const parsed = JSON.parse(trimmed);
            pretty = JSON.stringify(parsed, null, 2);
        } catch (e) {
            pretty = trimmed;
        }

        responseBox.innerHTML = pretty
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"\s*:)?\s*("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*")/g,
                function(match, key, value) {
                    let result = match;
                    if (key) {
                        result = key.replace(/"(.*)":/g, '<span class="json-key">"$1"</span>:');
                    }
                    if (value) {
                        result = result.replace(/"(.*)"/g, '<span class="json-string">"$1"</span>');
                    }
                    return result;
                })
            .replace(/: (true|false)/g, ': <span class="json-boolean">$1</span>')
            .replace(/: null/g, ': <span class="json-null">null</span>')
            .replace(/: (-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g, ': <span class="json-number">$1</span>');

        updateRequestLabel(requestName || 'unknown');
    }

    async function postJson(url, body, requestName) {
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const text = await res.text();
        setResponseContent(text || '{}', requestName || 'POST request');
        return { status: res.status, body: text };
    }

    async function getText(url, requestName) {
        const res = await fetch(url);
        const text = await res.text();
        setResponseContent(text || '{}', requestName || 'GET request');
        return { status: res.status, body: text };
    }

    function setSidebarCollapsed(collapsed) {
        sidebar.classList.toggle('collapsed', collapsed);
        pinToggle.textContent = collapsed ? '📌' : '📍';
        pinToggle.title = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
        localStorage.setItem(collapsedKey, String(collapsed));
    }

    function applyPinnedState() {
        const saved = localStorage.getItem(pinnedKey) === 'true';
        if (saved) {
            sidebar.classList.remove('collapsed');
            pinToggle.textContent = '📍';
            pinToggle.title = 'Collapse sidebar';
        } else {
            const collapsed = localStorage.getItem(collapsedKey) === 'true';
            setSidebarCollapsed(collapsed);
        }
    }

    pinToggle.addEventListener('click', () => {
        const collapsed = !sidebar.classList.contains('collapsed');
        localStorage.setItem(pinnedKey, String(!collapsed));
        setSidebarCollapsed(collapsed);
    });

    document.querySelectorAll('[data-request-name]').forEach((button) => {
        button.addEventListener('click', async () => {
            const requestName = button.dataset.requestName;
            const id = button.id;

            if (id === 'generateIdentity') {
                const payload = {
                    cid: document.getElementById('cid').value,
                    did: document.getElementById('did').value,
                    securityLevel: document.getElementById('securityLevel').value
                };
                await postJson('/api/v1/simulator/identity/generate', payload, requestName);
            } else if (id === 'generateAttestation') {
                const payload = {
                    cid: document.getElementById('cid').value,
                    did: document.getElementById('did').value,
                    securityLevel: document.getElementById('securityLevel').value
                };
                await postJson('/api/v1/simulator/attestation/generate', payload, requestName);
            } else if (id === 'enrollClient') {
                const payload = {
                    cid: document.getElementById('cid').value,
                    did: document.getElementById('did').value,
                    publicKey: 'test-public-key',
                    keyAlgorithm: 'EC',
                    attestation: 'simulated-attestation'
                };
                await postJson('/api/v1/simulator/enroll', payload, requestName);
            } else if (id === 'requestChallenge') {
                await getText('/api/v1/simulator/challenge?cid=' + encodeURIComponent(document.getElementById('cid').value), requestName);
            } else if (id === 'verifyProof') {
                const payload = {
                    cid: document.getElementById('cid').value,
                    did: document.getElementById('did').value,
                    challengeId: 'simulated-challenge',
                    signature: 'simulated-signature'
                };
                await postJson('/api/v1/simulator/verify-proof', payload, requestName);
            } else if (id === 'requestToken') {
                const payload = { clientId: document.getElementById('cid').value, subject: document.getElementById('did').value };
                await postJson('http://localhost:8083/api/v1/auth/token', payload, requestName);
            }
        });
    });

    copyButton.addEventListener('click', async () => {
        const text = responseBox.innerText || responseBox.textContent;
        try {
            await navigator.clipboard.writeText(text);
            copyButton.textContent = '✓';
            setTimeout(() => { copyButton.textContent = '⧉'; }, 1000);
        } catch (e) {
            copyButton.textContent = '×';
            setTimeout(() => { copyButton.textContent = '⧉'; }, 1000);
        }
    });

    applyPinnedState();
    setResponseContent('{\n  "message": "No response yet"\n}', 'none');
</script>
</body>
</html>
