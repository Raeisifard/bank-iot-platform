# Example only. Do not copy secrets into source control.

infrastructure:

  redis:
    enabled: true
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}

  kafka:
    enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${spring.application.name:bank-iot-service}
    consumer-group: ${spring.application.name:bank-iot-service}
    acks: all
    enable-idempotence: true
    retries: 10

  mongo:
    enabled: false
    uri: ${MONGO_URI:mongodb://localhost:27017}
    database: ${MONGO_DATABASE:banking}

  oracle:
    enabled: false
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/ORCL}
    username: ${ORACLE_USERNAME:}
    password: ${ORACLE_PASSWORD:}
    maximum-pool-size: 20
    minimum-idle: 5

  vault:
    enabled: true
    uri: ${VAULT_URI:http://localhost:8200}
    token: ${VAULT_TOKEN:}
    namespace: ${VAULT_NAMESPACE:}
