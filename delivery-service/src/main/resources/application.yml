server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: ${DELIVERY_SERVICE_NAME:delivery-service}
  profiles:
    active: dev
  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:9000}
        auto-registration: true
        instance:
          prefer-ip: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:172.16.88.115:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      enable-idempotence: true
      retries: 10

common:
  security:
    enabled: false
  web:
    security-enabled: false
    authentication-enabled: false
  redis:
    enabled: ${COMMON_REDIS_ENABLED:true}
    url: ${COMMON_REDIS_URL:redis://172.16.88.115:6379}
    password: ${REDIS_PASSWORD:StrongRedisPassword}
    database: ${REDIS_DATABASE:0}
    timeout: ${REDIS_TIMEOUT:2s}

delivery:
  enabled: ${DELIVERY_ENABLED:true}
  kafka:
    inbound-topic: ${DELIVERY_INBOUND_TOPIC:delivery.inbound}
    outbound-topic: ${DELIVERY_OUTBOUND_TOPIC:mqtt.message.send}
    acknowledgement-topic: ${DELIVERY_ACK_TOPIC:ack.event}
    consumer-group: ${DELIVERY_CONSUMER_GROUP:delivery-service}
  oracle:
    enabled: ${DELIVERY_ORACLE_ENABLED:true}
    url: ${ORACLE_JDBC_URL:jdbc:oracle:thin:@172.16.88.115:1521:XE}
    username: ${ORACLE_USERNAME:SYSTEM}
    password: ${ORACLE_PASSWORD:oracle}
    table-name: ${DELIVERY_ORACLE_TABLE:IOT_DELIVERY_MESSAGE}
  retry:
    publish-timeout: ${DELIVERY_PUBLISH_TIMEOUT:10s}
    scheduler-interval-ms: ${DELIVERY_RETRY_SCHEDULER_INTERVAL_MS:1000}
    delays: ${DELIVERY_RETRY_DELAYS:2s,5s}
  audit:
    pending-ttl: ${DELIVERY_PENDING_TTL:7d}
    delivered-ttl: ${DELIVERY_DELIVERED_TTL:30d}
    failed-ttl: ${DELIVERY_FAILED_TTL:90d}
    archived-ttl: ${DELIVERY_ARCHIVED_TTL:180d}

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    health:
      show-details: always

  info:
    env:
      enabled: true

info:
  app:
    name: delivery-service
    description: Delivery service
    version: 1.0.0

logging:
  level:
    com.isc.delivery: INFO
    org.apache.kafka: WARN
    de.codecentric.boot.admin.client: DEBUG

