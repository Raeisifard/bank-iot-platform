openapi: 3.0.3

info:
  title: Universal Banking API
  version: 1.0.0
  description: Banking Authentication & Transaction APIs

servers:
  - url: http://localhost:8083

tags:
  - name: Authentication
  - name: Transaction
  - name: Security
  - name: Health
  - name: Acknowledge

paths:

  /api/v1/auth/token:
    post:
      tags:
        - Authentication
      summary: Generate access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid credentials

  /api/v1/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid refresh token

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Revoke token & session
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful

  /actuator/health:
    get:
      tags:
        - Health
      summary: Service health check
      responses:
        '200':
          description: Service healthy

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    LoginRequest:
      type: object
      required:
        - customerId
        - deviceId
        - clientId
      properties:
        customerId:
          type: string
          example: CUST-1001
        deviceId:
          type: string
          example: DEVICE-1
        clientId:
          type: string
          example: MOBILE-APP

    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 900

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string